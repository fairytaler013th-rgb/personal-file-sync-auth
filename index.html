<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人文件同步</title><style>body{max-width:720px;margin:64px auto;padding:0 24px;font:17px/1.8 system-ui;color:#202124}a{color:#165dcc}</style><h1>个人文件同步</h1><p>“GitHub / Drive 本地备用同步”是所有者自用的文件传输工具，在指定的 Google Drive 目录和 GitHub 仓库之间同步文件。云端为主，本机备用程序在所有者电脑运行时补充传输。</p><p>它不调用 AI 模型，不分析或决定创作内容，不收费。本页面只介绍工具，不提供登录，也不访问访问者的 Google Drive。</p><p><a href="privacy.html">数据使用说明</a> · <a href="terms.html">工具使用说明</a></p>
